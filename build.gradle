plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom-remap' version '1.18.3' apply false
    id 'net.fabricmc.fabric-loom' version '1.18.3' apply false
}
group = 'dev.nostalgicf3'
version = project.mod_version
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
sourceSets.main.java.srcDirs = ['src/shared/java']
tasks.register('layoutTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nostalgicf3.layout.LayoutTest'
}
tasks.check.dependsOn layoutTest
tasks.register('buildAll') {
    dependsOn layoutTest
    dependsOn subprojects.collect { "${it.path}:build" }
}
subprojects {
    def mc = project.name
    def legacy = mc.startsWith('1.')
    def minimumLoader = legacy ? rootProject.legacy_loader_version : rootProject.loader_version
    apply plugin: legacy ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
    group = rootProject.group
    version = "${rootProject.version}+mc${mc}"
    base { archivesName = 'nostalgicf3' }
    repositories { mavenCentral() }
    dependencies {
        minecraft "com.mojang:minecraft:${mc}"
        if (legacy) mappings loom.officialMojangMappings()
        add(legacy ? 'modImplementation' : 'implementation', "net.fabricmc:fabric-loader:${minimumLoader}")
    }
    java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
    tasks.withType(JavaCompile).configureEach { options.release = 21 }
    def generated = layout.buildDirectory.dir('generated/sources/client')
    tasks.register('generateVersionSources') {
        inputs.dir rootProject.file('src/client-template')
        inputs.property 'minecraftVersion', mc
        outputs.dir generated
        doLast {
            rootProject.file('src/client-template').eachFileRecurse { input ->
                if (input.isFile()) {
                    if (input.name == 'LegacyEntityCounterMixin.java' && !legacy) return
                    def newerGui = mc == '26.2' || mc == '26.3'
                    if (input.name == 'EarlyDebugOverlayMixin.java' && newerGui) return
                    if (input.name == 'ModernEarlyDebugOverlayMixin.java' && !newerGui) return
                    def relative = rootProject.file('src/client-template').toPath().relativize(input.toPath()).toString()
                    def output = new File(generated.get().asFile, relative)
                    output.parentFile.mkdirs()
                    output.text = input.getText('UTF-8')
                        .replace('@ID@', mc == '1.21.10' ? 'ResourceLocation' : 'Identifier')
                        .replace('@RENDER@', legacy ? 'render' : 'extractRenderState')
                        .replace('@GUI_METHOD@', legacy ? 'render' : 'extractGui')
                        .replace('@DEBUG_METHOD@', legacy ? 'renderDebugOverlay' : 'extractDebugOverlay')
                        .replace('@HIDDEN@', newerGui ? 'gui.hud.isHidden()' : 'options.hideGui')
                        .replace('@LINES@', legacy ? 'renderLines' : 'extractLines')
                        .replace('@GRAPHICS@', legacy ? 'GuiGraphics' : 'GuiGraphicsExtractor').replace('@EXTRA_ARG@', mc == '26.3' ? 'I' : '')
                }
            }
        }
    }
    sourceSets.main.java.srcDirs = [rootProject.file('src/shared/java'), generated]
    sourceSets.main.resources.srcDirs = [rootProject.file('src/main/resources')]
    tasks.compileJava.dependsOn generateVersionSources
    tasks.sourcesJar.dependsOn generateVersionSources
    tasks.processResources {
        def range = mc == '1.21.10' ? '>=1.21.9 <=1.21.10' : mc == '26.1.2' ? '>=26.1 <=26.1.2' : mc
        inputs.property 'minecraftRange', range
        inputs.property 'modVersion', project.version
        inputs.property 'minimumLoader', minimumLoader
        inputs.property 'mixinJava', 21
        filesMatching('fabric.mod.json') { expand(version: project.version, minecraft: range, java: legacy ? 21 : 25, loader: minimumLoader) }
        filesMatching('nostalgicf3.mixins.json') { expand(java: 21,
                extraMixins: (legacy ? ', "LegacyEntityCounterMixin"' : '') +
                    ((mc == '26.2' || mc == '26.3') ? ', "ModernEarlyDebugOverlayMixin"' : ', "EarlyDebugOverlayMixin"')) }
    }
    tasks.register('collectJar', Copy) {
        def artifact = tasks.named(legacy ? 'remapJar' : 'jar')
        dependsOn artifact
        from artifact.flatMap { it.archiveFile }
        into rootProject.layout.buildDirectory.dir('libs')
    }
    tasks.build.finalizedBy collectJar
}
repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral() }
sourceSets { probe }
dependencies { probeCompileOnly "net.fabricmc:fabric-loader:${loader_version}" }
tasks.named('compileProbeJava') { options.release = 21 }
tasks.register('probeJar', Jar) {
    dependsOn probeClasses
    from sourceSets.probe.output
    archiveFileName = 'mixin-probe.jar'
    destinationDirectory = layout.buildDirectory.dir('probe')
}
tasks.register('probeAll') {
    dependsOn subprojects.collect { "${it.path}:runMixinProbe" }
}
subprojects {
    loom {
        runs {
            mixinProbe {
                client()
                runDir 'build/mixin-probe-run'
                vmArg "-Dfabric.addMods=${rootProject.layout.buildDirectory.file('probe/mixin-probe.jar').get().asFile.absolutePath}"
            }
        }
    }
        tasks.named('runMixinProbe') {
        dependsOn rootProject.tasks.named('probeJar')
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(project.name.startsWith('1.') ? 21 : 25) }
    }
    tasks.named('runClient') {
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(project.name.startsWith('1.') ? 21 : 25) }
    }
}
